<!--STYLE-->
  <style>
    .contact { max-width: 640px; }
    .contact form .field { margin-bottom: 14px; }
    .contact .privacy-note { font-size: 0.85rem; color: var(--muted); margin: 4px 0 14px; }
    .contact .success-box { justify-content: flex-start; text-align: start; padding: 20px; }
  </style>
<!--/STYLE-->
<!--BODY-->
  <main id="main" tabindex="-1">
    <div class="wrap contact">
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>

      <section class="card reveal">
        <form name="contact" method="POST" action="/" data-ajax data-success="contactSuccess" novalidate>
          <input type="hidden" name="form-name" value="contact">
          <p class="hp"><label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>

          <div class="field">
            <label class="field-label" for="cName" data-t="name"></label>
            <input id="cName" type="text" name="name" required autocomplete="name" maxlength="100">
          </div>
          <div class="field">
            <label class="field-label" for="cEmail" data-t="email"></label>
            <input id="cEmail" type="email" name="email" required autocomplete="email" inputmode="email" maxlength="200">
          </div>
          <div class="field">
            <label class="field-label" for="cMessage" data-t="message"></label>
            <textarea id="cMessage" name="message" required maxlength="5000"></textarea>
          </div>
          <p class="privacy-note" data-t="note"></p>
          <button type="submit" class="btn btn-primary" data-t="send"></button>
          <p class="form-msg" role="alert" aria-live="polite"></p>
        </form>

        <div class="success-box" id="contactSuccess" tabindex="-1" role="status" hidden>
          <span class="check" aria-hidden="true">✓</span><span data-t="success"></span>
        </div>
      </section>

      <p class="last-updated" data-updated="2026-11-13"></p>
    </div>
  </main>
<!--/BODY-->
