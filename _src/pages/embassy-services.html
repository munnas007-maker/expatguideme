lso apply at the Pakistan embassy or consulate.", "id": "Apply for a new NICOP or renew it in the NADRA Pak ID app. A valid NICOP is needed for many services and for travel with a foreign passport.", "pcc": "Police character certificates and other consular services are handled through the Pakistan mission. Find your embassy or consulate in the Ministry of Foreign Affairs list.", "attest": "Document attestation is done at the Pakistan embassy or consulate. Check the mission's consular page for timings and fees.", "help": "For workplace or legal problems, contact the Community Welfare Attaché at your Pakistan embassy or consulate."}, "np": {"passport": "For an e-passport, first fill in the online pre-enrolment form of the Department of Passports. Then visit the Nepal embassy in person with your current passport and residence ID for biometrics.", "id": "Nepal does not issue a separate overseas ID card. Keep your passport and citizenship certificate copies safe.", "pcc": "For a Nepal police report and other consular letters, contact the embassy's consular section. The embassy website lists the documents needed.", "attest": "The embassy can attest documents and verify papers such as demand letters and power of attorney. See the embassy's service list.", "help": "For problems with salary, contract or sponsor, contact the embassy's labour section. Keep copies of your contract and passport."}}, "ar": {"in": {"passport": "املأ استمارة الجواز إلكترونيًا، ثم قدّمها مع جوازك القديم وإقامتك أو بطاقتك المدنية في المركز الذي تعتمده السفارة: في السعودية مراكز VFS Global وفي الكويت مراكز BLS International. راجع صفحة الجوازات في موقع السفارة لمعرفة المراكز والرسوم والمواعيد الحالية.", "id": "يُقدَّم طلب بطاقة OCI لأفراد العائلة الحاملين جنسية أجنبية عبر موقع OCI Services ثم عن طريق السفارة.", "pcc": "تصدر السفارة شهادة حسن السيرة الهندية عبر خدمة الجوازات نفسها: قدّم الطلب إلكترونيًا ثم سلّمه في مركز الجوازات.", "attest": "يمكن تصديق الشهادات الدراسية ووثائق الزواج وغيرها عبر السفارة أو مركز خدماتها. راجع صفحة التصديق لمعرفة الوثائق والرسوم.", "help": "لمشكلات الراتب أو الكفيل أو القضايا القانونية، سجّل شكوى في بوابة مدد التابعة لوزارة الخارجية الهندية أو تواصل مع قسم رعاية الجالية في السفارة."}, "pk": {"passport": "يمكن للباكستانيين في الخارج تجديد الجواز إلكترونيًا عبر موقع الجوازات (DGIP)، ويتم التحقق من البصمة في تطبيق Pak ID من نادرا، ويصل الجواز بالبريد السريع. ويمكنك أيضًا التقديم في السفارة أو القنصلية.", "id": "قدّم طلب بطاقة NICOP جديدة أو جدّدها في تطبيق Pak ID من نادرا. البطاقة السارية مطلوبة لخدمات كثيرة وللسفر بجواز أجنبي.", "pcc": "تُقدَّم شهادة حسن السيرة والخدمات القنصلية الأخرى عبر البعثة الباكستانية. ابحث عن سفارتك أو قنصليتك في قائمة وزارة الخارجية.", "attest": "يتم تصديق الوثائق في السفارة أو القنصلية الباكستانية. راجع الصفحة القنصلية لمعرفة المواعيد والرسوم.", "help": "لمشكلات العمل أو القضايا القانونية، تواصل مع ملحق رعاية الجالية في السفارة أو القنصلية الباكستانية."}, "np": {"passport": "للحصول على جواز إلكتروني، املأ أولًا استمارة التسجيل المسبق في موقع إدارة الجوازات، ثم راجع سفارة نيبال شخصيًا مع جوازك الحالي وإقامتك لأخذ البصمات.", "id": "لا تصدر نيبال بطاقة خاصة للمقيمين في الخارج. احتفظ بنسخ من جوازك وشهادة الجنسية في مكان آمن.", "pcc": "للحصول على تقرير الشرطة النيبالية وخطابات قنصلية أخرى، تواصل مع القسم القنصلي في السفارة، ويعرض موقعها الوثائق المطلوبة.", "attest": "يمكن للسفارة تصديق الوثائق والتحقق من أوراق مثل خطابات الطلب والوكالات. راجع قائمة خدمات السفارة.", "help": "لمشكلات الراتب أو العقد أو الكفيل، تواصل مع قسم العمل في السفارة، واحتفظ بنسخ من عقدك وجوازك."}}, "hi": {"in": {"passport": "पासपोर्ट फ़ॉर्म ऑनलाइन भरें, फिर पुराने पासपोर्ट और इक़ामा, सिविल आईडी या दूसरे रेज़िडेंस आईडी के साथ उस सेंटर पर जमा करें जिसे दूतावास इस्तेमाल करता है। सऊदी अरब में VFS Global और कुवैत में BLS International। मौजूदा सेंटर, फ़ीस और अपॉइंटमेंट के लिए दूतावास का पासपोर्ट पेज देखें।", "id": "विदेशी नागरिकता वाले परिवार के सदस्यों के OCI कार्ड के लिए OCI Services वेबसाइट पर आवेदन करें, फिर दूतावास के ज़रिए जमा करें।", "pcc": "भारत का पुलिस क्लियरेंस सर्टिफ़िकेट (PCC) दूतावास इसी पासपोर्ट सेवा से जारी करता है। ऑनलाइन आवेदन करें, फिर पासपोर्ट सेंटर पर जमा करें।", "attest": "शैक्षिक, विवाह और दूसरे दस्तावेज़ दूतावास या उसके सर्विस सेंटर से सत्यापित होते हैं। ज़रूरी दस्तावेज़ और फ़ीस के लिए अटेस्टेशन पेज देखें।", "help": "सैलरी, स्पॉन्सर या क़ानूनी मामलों की समस्या के लिए विदेश मंत्रालय के MADAD पोर्टल पर शिकायत दर्ज करें, या दूतावास के कम्युनिटी वेलफ़ेयर विंग से संपर्क करें।"}, "pk": {"passport": "विदेश में रहने वाले पाकिस्तानी DGIP ऑनलाइन पासपोर्ट वेबसाइट पर पासपोर्ट नवीनीकृत कर सकते हैं। फ़िंगरप्रिंट जाँच NADRA Pak ID ऐप में होती है और पासपोर्ट कूरियर से आता है। आप दूतावास या कॉन्सुलेट में भी आवेदन कर सकते हैं।", "id": "नया NICOP या उसका नवीनीकरण NADRA Pak ID ऐप में करें। कई सेवाओं और विदेशी पासपोर्ट पर यात्रा के लिए वैध NICOP ज़रूरी है।", "pcc": "पुलिस कैरेक्टर सर्टिफ़िकेट और दूसरी कॉन्सुलर सेवाएँ पाकिस्तान मिशन से होती हैं। विदेश मंत्रालय की सूची में अपना दूतावास या कॉन्सुलेट देखें।", "attest": "दस्तावेज़ों का सत्यापन पाकिस्तान दूतावास या कॉन्सुलेट में होता है। समय और फ़ीस के लिए मिशन का कॉन्सुलर पेज देखें।", "help": "काम या क़ानूनी समस्याओं के लिए अपने पाकिस्तान दूतावास या कॉन्सुलेट के कम्युनिटी वेलफ़ेयर अटैशे से संपर्क करें।"}, "np": {"passport": "ई-पासपोर्ट के लिए पहले पासपोर्ट विभाग का ऑनलाइन प्री-एनरोलमेंट फ़ॉर्म भरें। फिर मौजूदा पासपोर्ट और रेज़िडेंस आईडी के साथ बायोमेट्रिक्स के लिए नेपाल दूतावास में ख़ुद जाएँ।", "id": "नेपाल विदेश में रहने वालों के लिए अलग आईडी कार्ड जारी नहीं करता। अपने पासपोर्ट और नागरिकता प्रमाणपत्र की कॉपी सुरक्षित रखें।", "pcc": "नेपाल पुलिस रिपोर्ट और दूसरे कॉन्सुलर पत्रों के लिए दूतावास के कॉन्सुलर सेक्शन से संपर्क करें। ज़रूरी दस्तावेज़ दूतावास की वेबसाइट पर हैं।", "attest": "दूतावास दस्तावेज़ सत्यापित कर सकता है और डिमांड लेटर, पावर ऑफ़ अटॉर्नी जैसे काग़ज़ जाँच सकता है। दूतावास की सेवा सूची देखें।", "help": "सैलरी, कॉन्ट्रैक्ट या स्पॉन्सर की समस्या के लिए दूतावास के लेबर सेक्शन से संपर्क करें। अपने कॉन्ट्रैक्ट और पासपोर्ट की कॉपी रखें।"}}, "ml": {"in": {"passport": "പാസ്പോർട്ട് ഫോം ഓൺലൈനായി പൂരിപ്പിച്ച്, പഴയ പാസ്പോർട്ടും ഇഖാമ, സിവിൽ ഐഡി പോലുള്ള റെസിഡൻസ് ഐഡിയും സഹിതം എംബസി നിശ്ചയിച്ച സെന്ററിൽ സമർപ്പിക്കുക. സൗദിയിൽ VFS Global, കുവൈത്തിൽ BLS International. നിലവിലെ സെന്ററുകൾ, ഫീസ്, അപ്പോയിന്റ്മെന്റ് എന്നിവയ്ക്ക് എംബസിയുടെ പാസ്പോർട്ട് പേജ് നോക്കുക.", "id": "വിദേശ പൗരത്വമുള്ള കുടുംബാംഗങ്ങൾക്കുള്ള OCI കാർഡിന് OCI Services വെബ്സൈറ്റിൽ അപേക്ഷിച്ച് എംബസി വഴി സമർപ്പിക്കുക.", "pcc": "ഇന്ത്യയുടെ പോലീസ് ക്ലിയറൻസ് സർട്ടിഫിക്കറ്റ് (PCC) എംബസി ഇതേ പാസ്പോർട്ട് സേവനം വഴി നൽകുന്നു. ഓൺലൈനായി അപേക്ഷിച്ച് പാസ്പോർട്ട് സെന്ററിൽ സമർപ്പിക്കുക.", "attest": "വിദ്യാഭ്യാസ, വിവാഹ രേഖകളും മറ്റും എംബസിയിലോ അതിന്റെ സർവീസ് സെന്ററിലോ അറ്റസ്റ്റ് ചെയ്യാം. ആവശ്യമായ രേഖകൾക്കും ഫീസിനും അറ്റസ്റ്റേഷൻ പേജ് നോക്കുക.", "help": "ശമ്പളം, സ്പോൺസർ, നിയമപ്രശ്നങ്ങൾ എന്നിവയ്ക്ക് വിദേശകാര്യ മന്ത്രാലയത്തിന്റെ MADAD പോർട്ടലിൽ പരാതി നൽകുക, അല്ലെങ്കിൽ എംബസിയുടെ കമ്മ്യൂണിറ്റി വെൽഫെയർ വിഭാഗത്തെ ബന്ധപ്പെടുക."}, "pk": {"passport": "വിദേശത്തുള്ള പാകിസ്ഥാനികൾക്ക് DGIP ഓൺലൈൻ പാസ്പോർട്ട് വെബ്സൈറ്റിൽ പാസ്പോർട്ട് പുതുക്കാം. വിരലടയാള പരിശോധന NADRA Pak ID ആപ്പിലാണ്, പാസ്പോർട്ട് കൊറിയറിൽ എത്തും. എംബസിയിലോ കോൺസുലേറ്റിലോ നേരിട്ടും അപേക്ഷിക്കാം.", "id": "പുതിയ NICOP-നോ പുതുക്കലിനോ NADRA Pak ID ആപ്പ് ഉപയോഗിക്കുക. പല സേവനങ്ങൾക്കും വിദേശ പാസ്പോർട്ടിൽ യാത്രയ്ക്കും സാധുവായ NICOP വേണം.", "pcc": "പോലീസ് ക്യാരക്ടർ സർട്ടിഫിക്കറ്റും മറ്റ് കോൺസുലർ സേവനങ്ങളും പാകിസ്ഥാൻ മിഷൻ വഴിയാണ്. വിദേശകാര്യ മന്ത്രാലയ പട്ടികയിൽ നിങ്ങളുടെ എംബസി കണ്ടെത്തുക.", "attest": "രേഖകളുടെ അറ്റസ്റ്റേഷൻ പാകിസ്ഥാൻ എംബസിയിലോ കോൺസുലേറ്റിലോ ആണ്. സമയവും ഫീസും മിഷന്റെ കോൺസുലർ പേജിൽ നോക്കുക.", "help": "ജോലി, നിയമ പ്രശ്നങ്ങൾക്ക് പാകിസ്ഥാൻ എംബസിയിലെ കമ്മ്യൂണിറ്റി വെൽഫെയർ അറ്റാഷെയെ ബന്ധപ്പെടുക."}, "np": {"passport": "ഇ-പാസ്പോർട്ടിന് ആദ്യം പാസ്പോർട്ട് വകുപ്പിന്റെ ഓൺലൈൻ പ്രീ-എൻറോൾമെന്റ് ഫോം പൂരിപ്പിക്കുക. പിന്നീട് നിലവിലെ പാസ്പോർട്ടും റെസിഡൻസ് ഐഡിയുമായി ബയോമെട്രിക്സിനായി നേപ്പാൾ എംബസിയിൽ നേരിട്ട് പോകുക.", "id": "വിദേശത്തുള്ളവർക്ക് നേപ്പാൾ പ്രത്യേക ഐഡി കാർഡ് നൽകുന്നില്ല. പാസ്പോർട്ടിന്റെയും പൗരത്വ സർട്ടിഫിക്കറ്റിന്റെയും പകർപ്പുകൾ സുരക്ഷിതമാ           var links = LINKS[state.nat][t[0]];
          if (links.length) {
            var lw = el("div", "links");
            links.forEach(function (l) { var a = el("a", "btn btn-ghost", l[0]); a.href = l[1] === "emb" ? embUrl : l[1]; a.target = "_blank"; a.rel = "noopener"; lw.appendChild(a); });
            sec.appendChild(lw);
          }
          box.appendChild(sec);
        });
        window.ExpatSite.tagOutbound(document.querySelector(".emb .card"));
      }
      function save() { try { localStorage.setItem(PREF_KEY, JSON.stringify(state)); } catch (e) {} }
      $("nat").addEventListener("change", function () { state.nat = this.value; save(); render(); });
      $("liv").addEventListener("change", function () { state.liv = this.value; save(); render(); });
      window.ExpatSite.onLang(render);
    })();
  </script>
