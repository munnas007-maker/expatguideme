      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      var firstRender = true;

      function render(lang) {
        var L = T[lang] || T.en;
        document.querySelectorAll("[data-t]").forEach(function (n) { n.textContent = L[n.getAttribute("data-t")] || ""; });

        var grid = document.getElementById("tools");
        grid.innerHTML = "";
        TOOLS.forEach(function (t, i) {
          var text = t[lang] || t.en;
          var card = el(t.href ? "a" : "div", "tool" + (t.href ? "" : " disabled") + (firstRender ? " reveal" : ""));
          card.setAttribute("data-c", t.c || "money");
          if (firstRender) card.style.setProperty("--i", i);
          if (t.href) card.href = window.ExpatSite.href ? window.ExpatSite.href(t.href) : t.href;
          var svg = svgIcon(t.ic);
          var icon = el("div", "icon", svg ? null : t.icon);
          if (svg) icon.appendChild(svg);
          icon.setAttribute("aria-hidden", "true");
          card.appendChild(icon);
          card.appendChild(el("h3", null, text[0]));
          card.appendChild(el("p", null, text[1]));
          card.appendChild(el("span", "tag " + (t.href ? "live" : "soon"), t.href ? L.live : L.soon));
          grid.appendChild(card);
        });

        var cl = document.getElementById("countries");
        cl.innerHTML = "";
        COUNTRIES.forEach(function (c) { cl.appendChild(el("span", "country", c.flag + " " + (c[lang] || c.en))); });

        firstRender = false;
      }

      window.ExpatSite.onLang(render);
