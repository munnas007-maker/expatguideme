        var wa = "https://wa.me/?text=" + encodeURIComponent(waText());
        $("waBtn").href = wa; $("waBtn2").href = wa;
      }

      /* ---------- Hub ---------- */
      function renderHub() {
        var s = src(), d = dst();
        $("corName").textContent = s.flag + " " + nm(s) + "  →  " + d.flag + " " + nm(d);
        $("corRate").textContent = state.market ? "1 " + s.cur + " = " + fmtRate(state.market) + " " + d.cur : "…";
        $("corMeta").textContent = state.market ? L("marketNote") : L("loading");
        $("amountLabel").textContent = fill(L("amountLabel"), { cur: s.cur });
        $("updRateLabel").textContent = fill(L("updRate"), { from: s.cur, to: d.cur });
        $("updFeeLabel").textContent = fill(L("updFee"), { cur: s.cur });
        var st = $("ratesStatus");
        st.hidden = !state.loadFailed;
        st.textContent = state.loadFailed ? L("loadError") : "";

        var chips = $("fundChips"); chips.innerHTML = "";
        chips.appendChild(el("span", "lbl", L("fundLabel")));
        s.fund.forEach(function (f) { chips.appendChild(el("span", "chip", (FUND[lang()] && FUND[lang()][f]) || f)); });

        var sel = $("updProvider"), keep = sel.value; sel.innerHTML = "";
        PROVIDERS[state.src].forEach(function (p) { var o = el("option", null, p.name); o.value = p.id; sel.appendChild(o); });
        if (keep && PROVIDERS[state.src].some(function (p) { return p.id === keep; })) sel.value = keep;

        $("fbRoute").value = s.cur + "-" + d.cur;
        $("copyLink").setAttribute("data-copy-text", routeUrl());
        renderRows();
      }

      function showPanel(name) {
        if (name === "calc") { state.panel = "rates"; } else { state.panel = name; }
        ["rates", "graph", "update", "share", "feedback"].forEach(function (p) {
          $("p" + p.charAt(0).toUpperCase() + p.slice(1)).hidden = p !== state.panel;
        });
        document.querySelectorAll(".act").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-act") === name || (name === "rates" && false))); });
        if (name === "calc") { $("amount").focus(); $("amount").select(); }
        if (name === "graph") renderGraph();
        var panel = $("p" + state.panel.charAt(0).toUpperCase() + state.panel.slice(1));
        if (panel && panel.scrollIntoView && name !== "rates") panel.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      /* ---------- Graph ---------- */
      function drawChart(points, note) {
        var box = $("chart"), stats = $("chartStats");
        box.innerHTML = ""; stats.innerHTML = "";
        $("chartNote").textContent = note || "";
        if (!points || points.length < 2) { box.appendChild(el("p", "table-note", L("graphEmpty"))); return; }
        var W = 640, H = 240, P = 36;
        var vals = points.map(function (p) { return p.r; });
        var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
        if (max === min) { max += max * 0.001; min -= min * 0.001; }
        var x = function (i) { return P + (i * (W - P * 2)) / (points.length - 1); };
        var y = function (v) { return H - P - ((v - min) * (H - P * 2)) / (max - min); };
        var ns = "http://www.w3.org/2000/svg";
        var svg = document.createElementNS(ns, "svg");
        svg.setAttribute("viewBox", "0 0 " + W + " " + H);
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", L("graphTitle"));
        var d = points.map(function (p, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.r).toFixed(1); }).join(" ");
        var area = document.createElementNS(ns, "path");
        area.setAttribute("d", d + " L" + x(points.length - 1).toFixed(1) + " " + (H - P) + " L" + x(0).toFixed(1) + " " + (H - P) + " Z");
        area.setAttribute("fill", "var(--brand-soft)");
        svg.appendChild(area);
        var line = document.createElementNS(ns, "path");
        line.setAttribute("d", d); line.setAttribute("fill", "none"); line.setAttribute("stroke", "var(--brand)"); line.setAttribute("stroke-width", "2.5");
        svg.appendChild(line);
        [[min, H - P], [max, P]].forEach(function (pair) {
          var t = document.createElementNS(ns, "text");
          t.setAttribute("x", "4"); t.setAttribute("y", String(pair[1] + 4)); t.setAttribute("font-size", "11"); t.setAttribute("fill", "var(--muted)");
          t.textContent = fmtRate(pair[0]); svg.appendChild(t);
        });
        [[0, "start"], [points.length - 1, "end"]].forEach(function (pair) {
          var t = document.createElementNS(ns, "text");
          t.setAttribute("x", String(x(pair[0]))); t.setAttribute("y", String(H - 8)); t.setAttribute("font-size", "11"); t.setAttribute("fill", "var(--muted)");
          t.setAttribute("text-anchor", pair[1]); t.setAttribute("direction", "ltr");
          t.textContent = points[pair[0]].d; svg.appendChild(t);
        });
        var dot = document.createElementNS(ns, "circle");
        dot.setAttribute("cx", String(x(points.length - 1))); dot.setAttribute("cy", String(y(vals[vals.length - 1]))); dot.setAttribute("r", "4"); dot.setAttribute("fill", "var(--brand)");
        svg.appendChild(dot);
        box.appendChild(svg);
        [["high", max], ["low", min], ["now", vals[vals.length - 1]]].forEach(function (p) {
          var span = el("span"); span.appendChild(el("strong", null, L(p[0]) + ": ")); span.appendChild(document.createTextNode(fmtRate(p[1]))); stats.appendChild(span);
        });
      }

      function renderGraph() {
        var s = src(), d = dst();
        var usdTo = FRANK_DIRECT[d.cur], peg = USD_PEG[s.cur];
        if (usdTo && peg) {
          var end = new Date(), start = new Date(Date.now() - 30 * 86400000);
          var iso = function (t) { return t.toISOString().slice(0, 10); };
          drawChart([], L("loading"));
          fetch("https://api.frankfurter.app/" + iso(start) + ".." + iso(end) + "?from=USD&to=" + usdTo)
            .then(function (r) { return r.json(); })
            .then(function (data) {
              var pts = Object.keys(data.rates || {}).sort().map(function (k) {
                var v = data.rates[k][usdTo] / peg;
                if (d.cur === "NPR") v = v * 1.6;
                return { d: k, r: v };
              });
              if (src() !== s || dst() !== d) return;
              if (pts.length >= 2) drawChart(pts, L("graphFrank"));
              else drawChart(state.history, L("graphOwn"));
            })
            .catch(function () { drawChart(state.history, L("graphOwn")); });
        } else {
          drawChart(state.history, L("graphOwn"));
        }
      }

      /* ---------- Static text ---------- */
      function renderText() {
        document.querySelectorAll("[data-t]").forEach(function (n) { n.textContent = L(n.getAttribute("data-t")) || ""; });
        var ss = $("srcSel"), ds = $("dstSel");
        ss.innerHTML = ""; ds.innerHTML = "";
        SOURCES.forEach(function (s) { var o = el("option", null, s.flag + " " + nm(s) + " (" + s.cur + ")"); o.value = s.code; ss.appendChild(o); });
        DESTS.forEach(function (d) { var o = el("option", null, d.flag + " " + nm(d) + " (" + d.cur + ")"); o.value = d.code; ds.appendChild(o); });
        ss.value = state.src; ds.value = state.dst;
        $("nativeShare").hidden = !navigator.share;
      }

      /* ---------- Routing ---------- */
      function validRoute(s, d) {
        return SOURCES.some(function (x) { return x.code === s; }) && DESTS.some(function (x) { return x.code === d; });
      }
      function openRoute(push) {
        storeSet(PREF_KEY, JSON.stringify({ src: state.src, dst: state.dst }));
        $("picker").hidden = true;
        $("hub").hidden = false;
        if (push && location.hash !== routeHash()) { try { history.replaceState(null, "", routeHash()); } catch (e) { location.hash = routeHash(); } }
        showPanel("rates");
        load();
      }
      function readHash() {
        var m = /^#([a-z]{2})-([a-z]{2})$/.exec(location.hash || "");
        if (m && validRoute(m[1], m[2])) { state.src = m[1]; state.dst = m[2]; return true; }
        return false;
      }

      /* ---------- Events ---------- */
      $("srcSel").addEventListener("change", function () { state.src = this.value; });
      $("dstSel").addEventListener("change", function () { state.dst = this.value; });
      $("nextBtn").addEventListener("click", function () { state.src = $("srcSel").value; state.dst = $("dstSel").value; openRoute(true); });
      $("changeBtn").addEventListener("click", function () {
        $("hub").hidden = true; $("picker").hidden = false;
        $("srcSel").value = state.src; $("dstSel").value = state.dst; $("srcSel").focus();
      });
      document.querySelectorAll(".act").forEach(function (b) { b.addEventListener("click", function () { showPanel(b.getAttribute("data-act")); }); });
      $("amount").addEventListener("input", function () {
        var v = parseFloat(this.value); state.amount = isFinite(v) && v > 0 ? v : 0; renderRows();
      });
      $("nativeShare").addEventListener("click", function () {
        if (navigator.share) navigator.share({ title: document.title, text: waText(), url: routeUrl() }).catch(function () {});
      });
      window.addEventListener("hashchange", function () { if (readHash()) { $("srcSel").value = state.src; $("dstSel").value = state.dst; openRoute(false); } });

      $("updForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var msg = $("updMsg"); msg.className = ""; msg.textContent = "";
        var rate = parseFloat($("updRate").value), feeRaw = $("updFee").value.trim(), fee = feeRaw === "" ? null : parseFloat(feeRaw);
        if (!isFinite(rate) || rate <= 0) { msg.className = "form-err"; msg.textContent = fill(L("errRange"), { mid: state.market ? fmtRate(state.market) : "–" }); $("updRate").focus(); return; }
        if (fee != null && (!isFinite(fee) || fee < 0)) { msg.className = "form-err"; msg.textContent = L("errFee"); $("updFee").focus(); return; }
        var btn = $("updSubmit"); btn.disabled = true;
        var payload = { from: src().cur, to: dst().cur, provider: $("updProvider").value, rate: rate, fee: fee, website: $("updWebsite").value };
        fetch("/api/rates", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
          .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
          .then(function (res) {
            if (res.status === 200 && res.body.ok) {
              if (res.body.provider) state.providers[payload.provider] = res.body.provider;
              msg.className = "form-ok"; msg.textContent = L("updOk");
              $("updRate").value = ""; $("updFee").value = "";
              renderRows();
            } else if (res.body.error === "range") {
              msg.className = "form-err"; msg.textContent = fill(L("errRange"), { mid: fmtRate(res.body.market) });
            } else if (res.body.error === "fee") {
              msg.className = "form-err"; msg.textContent = L("errFee");
            } else if (res.body.error === "wait") {
              msg.className = "form-err"; msg.textContent = L("errWait");
            } else { throw new Error("save"); }
          })
          .catch(function () { msg.className = "form-err"; msg.textContent = L("errGeneric"); })
          .then(function () { btn.disabled = false; });
      });

      /* ---------- Start ---------- */
      var startHub = readHash();
      if (!startHub) {
        try { var saved = JSON.parse(storeGet(PREF_KEY) || "null"); if (saved && validRoute(saved.src, saved.dst)) { state.src = saved.src; state.dst = saved.dst; } } catch (e) {}
      }
      var firstLang = true;
      window.ExpatSite.onLang(function () {
        renderText();
        if (firstLang) { firstLang = false; if (startHub) openRoute(false); return; }
        if (!$("hub").hidden) { renderHub(); if (state.panel === "graph") renderGraph(); }
      });
      window.ExpatSendMoney = { state: state, rows: rows, waText: waText };
    })();
  </script>
<!--/SCRIPT-->
