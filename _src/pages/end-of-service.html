          else {
            var b = tiered(r.wage, y, 3, 0.5, 1);
            if (b.a > 0) r.lines.push({ y: b.a, rate: "rHalf", amt: b.amtA });
            if (b.b > 0) r.lines.push({ y: b.b, rate: "rMonth", amt: b.amtB });
            r.full = b.total;
            var preB = yearsBefore(svc, BAHRAIN_SIO);
            var employerPart = tiered(r.wage, preB, 3, 0.5, 1).total;
            r.split = { employer: employerPart, sio: r.full - employerPart };
          }
        }
        var gross = r.full;
        if (r.cap && gross > r.cap.amount) { gross = r.cap.amount; r.capped = true; }
        r.total = gross * r.share;
        if (r.split) {
          var f = r.full > 0 ? r.total / r.full : 0;
          r.split.employer *= f; r.split.sio *= f;
        }
        return r;
      }

      /* ---------- Rendering ---------- */
      function renderTabs(lang) {
        var box = $("countryTabs"); box.innerHTML = "";
        COUNTRIES.forEach(function (c) {
          var b = el("button", null, c.flag + " " + cname(c, lang));
          b.type = "button"; b.setAttribute("data-country", c.code);
          b.setAttribute("aria-pressed", String(c.code === state.country));
          b.addEventListener("click", function () { state.country = c.code; savePrefs(); render(); });
          box.appendChild(b);
        });
      }
      function renderSegs() {
        document.querySelectorAll("#reasonSeg button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-reason") === state.reason)); });
        document.querySelectorAll("#modeSeg button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === state.mode)); });
        $("yearsBox").hidden = state.mode !== "years";
        $("datesBox").hidden = state.mode !== "dates";
      }

      function serviceText(svc, Lx) {
        var totalMonths = Math.round(svc.years * 12 * 1000) / 1000;
        var Y = Math.floor(totalMonths / 12), M = Math.floor(totalMonths - Y * 12);
        var D = Math.round((totalMonths - Y * 12 - M) * 30.4167);
        if (D >= 30) { D = 0; M += 1; if (M === 12) { M = 0; Y += 1; } }
        var parts = [Y + " " + Lx.unitY, M + " " + Lx.unitM];
        if (D > 0) parts.push(D + " " + Lx.unitD);
        return parts.join(", ");
      }

      function renderResult() {
        var lang = window.ExpatSite.lang(), Lx = L(), c = country();
        var basic = num("basic"), allow = num("allow");
        var svc = service();
        $("dateError").hidden = !svc.error;
        if (svc.error || svc.empty || basic <= 0) {
          $("resultBody").hidden = true; $("resultEmpty").hidden = false; return;
        }
        var r = calculate(c.code, basic, allow, svc, state.reason);
        $("resultEmpty").hidden = true; $("resultBody").hidden = false;
        $("total").textContent = money(r.total, c, lang);

        var facts = $("facts"); facts.innerHTML = "";
        function fact(k, v) { var li = el("li"); li.appendChild(el("span", "k", k)); li.appendChild(el("span", "v", v)); facts.appendChild(li); return li; }
        fact(Lx.serviceLabel, serviceText(svc, Lx));
        fact(Lx.wageLabel, money(r.wage, c, lang));
        r.lines.forEach(function (ln) {
          var label = fill(Lx.lineFmt, { y: yrs(ln.y), rate: Lx[ln.rate] }) + (ln.tag ? " (" + Lx[ln.tag] + ")" : "");
          fact(label, money(ln.amt, c, lang));
        });
        if (r.share !== 1 && r.full > 0) fact(Lx.fullLabel, money(r.capped ? r.cap.amount : r.full, c, lang));

        var notes = $("notes"); notes.innerHTML = "";
        var noteTexts = [];
        if (r.capped) noteTexts.push(fill(Lx.nCap, { n: r.cap.months, amt: money(r.cap.amount, c, lang) }));
        r.notes.forEach(function (n) {
          noteTexts.push(fill(Lx[n.k], { n: n.n, share: n.share ? Lx[n.share] : "" }));
        });
        if (r.split && r.total > 0) noteTexts.push(fill(Lx.nBahrainSplit, { a: money(r.split.employer, c, lang), b: money(r.split.sio, c, lang) }));
        noteTexts.forEach(function (t) { notes.appendChild(el("li", null, t)); });

        var lines = [fill(Lx.copyHead, { country: cname(c, lang) }), Lx.totalLabel + ": " + money(r.total, c, lang)];
        facts.querySelectorAll("li").forEach(function (li) { lines.push(li.firstChild.textContent + ": " + li.lastChild.textContent); });
        noteTexts.forEach(function (t) { lines.push(t); });
        lines.push(location.origin + "/end-of-service.html");
        $("copyText").textContent = lines.join("\n");
      }

      function render() {
        var lang = window.ExpatSite.lang(), Lx = L(), c = country();
        document.querySelectorAll("[data-t]").forEach(function (n) {
          var k = n.getAttribute("data-t"); n.textContent = Lx[k] || T.en[k] || "";
        });
        renderTabs(lang);
        renderSegs();
        var cl = curLabel(c, lang), cn = cname(c, lang);
        $("basicLabel").textContent = fill(Lx.basicLabel, { cur: cl });
        $("allowLabel").textContent = fill(Lx.allowLabel, { cur: cl });
        var usesAllow = c.code === "sa" || c.code === "kw";
        $("allowHint").textContent = fill(usesAllow ? Lx.allowUsed : Lx.allowNotUsed, { country: cn });
        $("ruleTitle").textContent = fill(Lx.ruleTitle, { country: cn });
        $("ruleText").textContent = Lx.rule[c.code];
        var link = $("officialLink");
        link.textContent = fill(Lx.official, { auth: c.auth[lang] || c.auth.en });
        link.setAttribute("href", c.url);
        window.ExpatSite.tagOutbound(link.parentNode);
        renderResult();
      }

      /* ---------- Events ---------- */
      document.querySelectorAll("#reasonSeg button").forEach(function (b) {
        b.addEventListener("click", function () { state.reason = b.getAttribute("data-reason"); savePrefs(); renderSegs(); renderResult(); });
      });
      document.querySelectorAll("#modeSeg button").forEach(function (b) {
        b.addEventListener("click", function () {
          state.mode = b.getAttribute("data-mode"); savePrefs();
          if (state.mode === "dates" && !$("endDate").value) $("endDate").value = isoDay(todayUtc());
          renderSegs(); renderResult();
        });
      });
      ["years", "months", "startDate", "endDate", "basic", "allow", "unpaid"].forEach(function (id) {
        $(id).addEventListener("input", renderResult);
        $(id).addEventListener("change", renderResult);
      });
      $("eosForm").addEventListener("submit", function (e) { e.preventDefault(); renderResult(); });
      if (state.mode === "dates") $("endDate").value = isoDay(todayUtc());

      window.ExpatEOS = { calculate: calculate };
      window.ExpatSite.onLang(render);
    })();
  </script>
<!--/SCRIPT-->
