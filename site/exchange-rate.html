        var amt = parseFloat($("amount").value);
        if (!isFinite(amt) || amt < 0) amt = 0;
        var f = find(state.from), to = find(state.to);
        var r = rate(state.from, state.to);
        var box = $("result");
        var loading = !state.rates && !state.error;

        box.classList.toggle("loading", loading);
        box.setAttribute("aria-busy", loading ? "true" : "false");
        $("fromLine").textContent = fmtAmount(amt) + " " + f.code + " =";

        if (isFinite(r)) {
          $("bigResult").textContent = fmt(amt * r) + " " + to.code;
          $("unitRate").textContent = "1 " + f.code + " = " + fmt(r) + " " + to.code + "   ·   1 " + to.code + " = " + fmt(1 / r) + " " + f.code;
          $("copyText").textContent = fmtAmount(amt) + " " + f.code + " = " + fmt(amt * r) + " " + to.code + " (" + t("marketRate") + ", " + fmtDate(state.updatedUnix) + ")";
          $("copyResult").disabled = false;
        } else if (loading) {
          $("bigResult").innerHTML = '<span class="skeleton">&nbsp;</span>';
          $("unitRate").innerHTML = '<span class="skeleton">&nbsp;</span>';
          $("copyResult").disabled = true;
        } else {
          $("bigResult").textContent = "—";
          $("unitRate").textContent = "";
          $("copyResult").disabled = true;
        }

        $("qHeadFrom").textContent = f.flag + " " + f.code;
        $("qHeadTo").textContent = to.flag + " " + to.code;
        var body = $("quickBody");
        body.innerHTML = "";
        QUICK_AMOUNTS.forEach(function (q) {
          var tr = document.createElement("tr");
          var td1 = document.createElement("td");
          td1.textContent = fmtAmount(q) + " " + f.code;
          var td2 = document.createElement("td");
          td2.className = "num";
          if (isFinite(r)) td2.textContent = fmt(q * r) + " " + to.code;
          else if (loading) td2.innerHTML = '<span class="skeleton" style="width:110px">&nbsp;</span>';
          else td2.textContent = "—";
          tr.appendChild(td1);
          tr.appendChild(td2);
          body.appendChild(tr);
        });

        document.title = fmtAmount(amt) + " " + f.code + " to " + to.code + " | ExpatGuideME";
      }

      function renderAll() { renderTexts(); renderStatus(); renderResult(); }

      function saveFx() { storeSet(FX_KEY, { from: state.from, to: state.to }); }

      function applyData(data, stale) {
        state.rates = data.rates;
        state.updatedUnix = data.time_last_update_unix || Math.floor(Date.now() / 1000);
        state.stale = !!stale;
        state.error = false;
      }

      function loadRates(force) {
        var cached = storeGet(CACHE_KEY);
        var fresh = cached && cached.data && cached.data.rates && (Date.now() - cached.fetchedAt < CACHE_MAX_AGE);
        if (fresh && !force) { applyData(cached.data, false); renderAll(); return; }

        fetch(API_URL, { cache: "no-store" })
          .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
          .then(function (data) {
            if (!data || data.result !== "success" || !data.rates) throw new Error("Bad data");
            storeSet(CACHE_KEY, { fetchedAt: Date.now(), data: { rates: data.rates, time_last_update_unix: data.time_last_update_unix } });
            applyData(data, false);
            renderAll();
          })
          .catch(function () {
            if (cached && cached.data && cached.data.rates) applyData(cached.data, true);
            else state.error = true;
            renderAll();
          });
      }

      $("amount").addEventListener("input", renderResult);
      $("fromCur").addEventListener("change", function (e) { state.from = e.target.value; saveFx(); renderResult(); });
      $("toCur").addEventListener("change", function (e) { state.to = e.target.value; saveFx(); renderResult(); });
      $("swapBtn").addEventListener("click", function () {
        var tmp = state.from;
        state.from = state.to;
        state.to = tmp;
        $("fromCur").value = state.from;
        $("toCur").value = state.to;
        saveFx();
        renderResult();
      });

      var saved = storeGet(FX_KEY);
      if (saved) {
        if (find(saved.from)) state.from = saved.from;
        if (find(saved.to)) state.to = saved.to;
      }
      buildSelect($("fromCur"), state.from);
      buildSelect($("toCur"), state.to);

      window.ExpatSite.onLang(renderAll);
      loadRates(false);
    })();
  </script>
</body>
</html>
