      --warn-bg: #fff8e6;
      --warn-ink: #8a5a00;
      --err-bg: #fdecea;
      --err-ink: #a12a1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    html[lang="ar"] body { font-family: "Cairo", "Inter", Tahoma, sans-serif; line-height: 1.8; }
    html[lang="hi"] body, html[lang="ne"] body { font-family: "Noto Sans Devanagari", "Inter", sans-serif; line-height: 1.8; }
    html[lang="ml"] body { font-family: "Noto Sans Malayalam", "Inter", sans-serif; line-height: 1.8; }

    .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

    /* Header */
    header { background: var(--card); border-bottom: 1px solid var(--line); }
    .nav { display: flex; justify-content: space-between; align-items: center; min-height: 60px; gap: 10px; flex-wrap: wrap; padding: 8px 0; }
    .logo { font-weight: 700; font-size: 1.25rem; color: var(--ink); text-decoration: none; font-family: "Inter", sans-serif; direction: ltr; }
    .logo span { color: var(--brand); }
    .langs { display: flex; gap: 6px; flex-wrap: wrap; }
    .langs button {
      font: inherit; font-size: 0.85rem; font-weight: 600;
      padding: 5px 12px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
    }
    .langs button[lang="ar"] { font-family: "Cairo", sans-serif; }
    .langs button[lang="hi"], .langs button[lang="ne"] { font-family: "Noto Sans Devanagari", sans-serif; }
    .langs button[lang="ml"] { font-family: "Noto Sans Malayalam", sans-serif; }
    .langs button.active { background: var(--brand); color: #fff; border-color: var(--brand); }

    h1 { font-size: 1.7rem; margin: 28px 0 6px; line-height: 1.35; }
    .lead { color: var(--muted); margin-bottom: 20px; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 18px; }

    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: var(--muted); }

    input[type="number"], select {
      width: 100%; font: inherit; font-size: 1.15rem; font-weight: 600;
      color: var(--ink); background: #fff;
      padding: 12px 12px; border: 1px solid var(--line); border-radius: 10px; outline: none;
      font-family: "Inter", sans-serif;
    }
    input[type="number"] { font-size: 1.4rem; direction: ltr; }
    input:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(11,110,79,0.12); }

    .row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; margin-top: 14px; }
    .swap {
      font: inherit; font-size: 1.3rem; width: 48px; height: 48px;
      border-radius: 50%; border: 1px solid var(--line); background: var(--bg);
      cursor: pointer; color: var(--brand);
    }
    .swap:hover { background: var(--brand-soft); }

    .result {
      margin-top: 18px; padding: 18px; border-radius: 12px;
      background: var(--brand-soft); text-align: center;
    }
    .result .from-line { color: var(--muted); font-size: 1rem; direction: ltr; font-family: "Inter", sans-serif; }
    .result .big {
      font-size: 2.2rem; font-weight: 700; color: var(--brand);
      direction: ltr; font-family: "Inter", sans-serif; line-height: 1.3; word-break: break-word;
    }
    .result .unit { font-size: 0.95rem; color: var(--muted); direction: ltr; font-family: "Inter", sans-serif; margin-top: 4px; }

    .status { margin-top: 14px; font-size: 0.85rem; color: var(--muted); }
    .status.warn { background: var(--warn-bg); color: var(--warn-ink); padding: 8px 12px; border-radius: 8px; }
    .status.err { background: var(--err-bg); color: var(--err-ink); padding: 8px 12px; border-radius: 8px; }
    .retry {
      font: inherit; font-size: 0.85rem; font-weight: 600; margin-top: 8px;
      padding: 6px 14px; border-radius: 8px; border: 1px solid var(--err-ink);
      background: #fff; color: var(--err-ink); cursor: pointer;
    }

    .note {
      margin-top: 14px; padding: 10px 12px; border-radius: 8px;
      background: var(--warn-bg); color: var(--warn-ink); font-size: 0.9rem;
    }

    h2 { font-size: 1.1rem; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; font-family: "Inter", sans-serif; direction: ltr; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
    th { font-size: 0.8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    td.num { text-align: right; font-weight: 600; }
    th.num { text-align: right; }
    tr:last-child td { border-bottom: none; }

    .ad-slot {
      min-height: 100px; border: 1px dashed var(--line); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: #a0aec0; font-size: 0.85rem; margin-bottom: 18px;

    footer { color: var(--muted); font-size: 0.82rem; text-align: center; padding: 22px 0 40px; }
    footer p + p { margin-top: 6px; }
    footer a { color: var(--muted); }

    @media (max-width: 520px) {
      h1 { font-size: 1.45rem; }
      .row { grid-template-columns: 1fr; }
      .swap { justify-self: center; transform: rotate(90deg); }
      .result .big { font-size: 1.9rem; }

</head>

          updated: "पछिल्लो अपडेट:",
          loading: "दरहरू लोड हुँदैछन्…",

      var state = {

      function $(id) { return document.getElementById(id); }

      function t(key) { return (T[state.lang] && T[state.lang][key]) || T.en[key] || ""; }

      function find(code) {
        for (var i = 0; i < ALL.length; i++) if (ALL[i].code === code) return ALL[i];
        return { code: code, flag: "", name: code };
      }

      function fmt(n) {
        if (!isFinite(n)) return "—";
        var abs = Math.abs(n);
        var digits = abs !== 0 && abs < 1 ? 4 : 2;
        return n.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
      }

      function fmtAmount(n) {
        return n.toLocaleString("en-US", { maximumFractionDigits: 2 });
      }

      function fmtDate(unix) {
        if (!unix) return "";
        var d = new Date(unix * 1000);
        try {
          return d.toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
        } catch (e) {
          return d.toISOString();
        }
      }

      function storeGet(key) {
        try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
      }
      function storeSet(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
      }

      function rate(from, to) {
        if (!state.rates || !state.rates[from] || !state.rates[to]) return NaN;
        return state.rates[to] / state.rates[from];
      }

      /* ---------- Build selects ---------- */
      function buildSelect(sel, groups, selected) {
        sel.innerHTML = "";
        groups.forEach(function (g) {
          var og = document.createElement("optgroup");
          og.label = g.label;
          g.items.forEach(function (c) {
            var o = document.createElement("option");
            o.value = c.code;
            o.textContent = c.flag + " " + c.code + " – " + c.name;
            if (c.code === selected) o.selected = true;
            og.appendChild(o);
          });
          sel.appendChild(og);
        });
      }

      function buildSelects() {
        var groups = [
          { label: "Gulf", items: GULF },
          { label: "Home", items: HOME }
        ];
        buildSelect($("fromCur"), groups, state.from);
        buildSelect($("toCur"), groups, state.to);

      /* ---------- Render ---------- */
      function renderTexts() {
        document.documentElement.lang = state.lang;
        document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
        document.querySelectorAll("[data-t]").forEach(function (el) {
          el.textContent = t(el.getAttribute("data-t"));
        });
        document.querySelectorAll(".langs button").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-lang") === state.lang);
        });
      }

      function renderStatus() {
        var el = $("status");
        el.className = "status";
        el.innerHTML = "";

        if (state.error && !state.rates) {
          el.classList.add("err");
          el.appendChild(document.createTextNode(t("error")));
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "retry";
          btn.textContent = t("retry");
          btn.addEventListener("click", function () { loadRates(true); });
          el.appendChild(document.createElement("br"));
          el.appendChild(btn);
          return;
        }
        if (!state.rates) {
          el.textContent = t("loading");
          return;
        }
        if (state.stale) {
          el.classList.add("warn");
          el.textContent = t("offline") + " " + fmtDate(state.updatedUnix);

        el.textContent = t("updated") + " " + fmtDate(state.updatedUnix);
      }

      function renderResult() {
        var amt = parseFloat($("amount").value);
        if (!isFinite(amt) || amt < 0) amt = 0;
        var r = rate(state.from, state.to);
        var f = find(state.from);
        var to = find(state.to);

        $("fromLine").textContent = fmtAmount(amt) + " " + f.code + " =";
        if (isFinite(r)) {
          $("bigResult").textContent = fmt(amt * r) + " " + to.code;
          $("unitRate").textContent = "1 " + f.code + " = " + fmt(r) + " " + to.code + "   ·   1 " + to.code + " = " + fmt(1 / r) + " " + f.code;
        } else {
          $("bigResult").textContent = "—";
          $("unitRate").textContent = "";
        }

        $("qHeadFrom").textContent = f.flag + " " + f.code;
        $("qHeadTo").textContent = to.flag + " " + to.code;
        var body = $("quickBody");
        body.innerHTML = "";
        QUICK_AMOUNTS.forEach(function (q) {
          var tr = document.createElement("tr");
          var td1 = document.createElement("td");
          td1.textContent = fmtAmount(q) + " " + f.code;
          var td2 = document.createElement("td");
          td2.className = "num";
          td2.textContent = isFinite(r) ? fmt(q * r) + " " + to.code : "—";
          tr.appendChild(td1);
          tr.appendChild(td2);
          body.appendChild(tr);
        });

        document.title = fmtAmount(amt) + " " + f.code + " to " + to.code + " | ExpatGuideME";
      }

      function renderAll() {
        renderTexts();
        renderStatus();
        renderResult();
      }

      function savePrefs() {
        storeSet(PREF_KEY, { lang: state.lang, from: state.from, to: state.to });
      }

      /* ---------- Load rates ---------- */
      function applyData(data, stale) {
        state.rates = data.rates;
        state.updatedUnix = data.time_last_update_unix || Math.floor(Date.now() / 1000);
        state.stale = !!stale;
        state.error = false;
      }

      function loadRates(force) {
        var cached = storeGet(CACHE_KEY);
        var fresh = cached && cached.data && cached.data.rates && (Date.now() - cached.fetchedAt < CACHE_MAX_AGE);

        if (fresh && !force) {
          applyData(cached.data, false);
          renderAll();
          return;
        }

        if (!state.rates) renderStatus();

        fetch(API_URL, { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function (data) {
            if (!data || data.result !== "success" || !data.rates) throw new Error("Bad data");
            storeSet(CACHE_KEY, { fetchedAt: Date.now(), data: { rates: data.rates, time_last_update_unix: data.time_last_update_unix } });
            applyData(data, false);
            renderAll();
          })
          .catch(function () {
            if (cached && cached.data && cached.data.rates) {
              applyData(cached.data, true);
            } else {
              state.error = true;
            }
            renderAll();
          });
      }

      /* ---------- Events ---------- */
      $("amount").addEventListener("input", renderResult);

      $("fromCur").addEventListener("change", function (e) {
        state.from = e.target.value;
        savePrefs();
        renderResult();
      });

      $("toCur").addEventListener("change", function (e) {
        state.to = e.target.value;
        savePrefs();
        renderResult();
      });

      $("swapBtn").addEventListener("click", function () {
        var tmp = state.from;
        state.from = state.to;
        state.to = tmp;
        $("fromCur").value = state.from;
        $("toCur").value = state.to;
        savePrefs();
        renderResult();
      });

      document.querySelectorAll(".langs button").forEach(function (b) {
        b.addEventListener("click", function () {
          state.lang = b.getAttribute("data-lang");
          savePrefs();
          renderAll();
        });
      });

      /* ---------- Start ---------- */
      var prefs = storeGet(PREF_KEY);
      if (prefs) {
        if (T[prefs.lang]) state.lang = prefs.lang;
        if (find(prefs.from).flag) state.from = prefs.from;
        if (find(prefs.to).flag) state.to = prefs.to;
      }
      buildSelects();
      renderAll();
      loadRates(false);
    })();
  </script>
</body>
</html>
