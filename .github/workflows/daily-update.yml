# Daily robot: refreshes baseline currency rates and gold spot price, rebuilds all 8 languages and pushes.
# Netlify deploys the push automatically, and netlify/functions/deploy-succeeded.mjs
# then pings IndexNow (Bing, ChatGPT Search, Yandex and others) with the fresh pages.
name: Daily rate update

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 07:00 Riyadh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build tools
        run: npm install --no-audit --no-fund
      - name: Fetch today's currency rates and gold price
        run: python3 scripts/update_rates.py
      - name: Build all languages
        run: NODE_PATH=$PWD/node_modules python3 _src/build.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "ExpatGuideME robot"
          git config user.email "actions@users.noreply.github.com"
          git add -A _src/data site
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily rate update $(date -u +%Y-%m-%d)"
            git push
          fi
