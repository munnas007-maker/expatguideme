# Manual one-off: find which exchange houses publish their rates on public web pages.
name: Probe rate pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/probe_rate_pages.py
      - name: Save results to the probe-results branch (not part of the site)
        run: |
          cd probe
          git init -q -b probe-results
          git config user.name "ExpatGuideME robot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Probe $(date -u +%F' '%H:%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-results
