# Manual one-off tools for the rates research.
# mode=probe: download public pages of exchange houses into the probe-results branch.
# mode=cleanup (default): delete the probe-results branch.
name: Probe rate pages
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe or cleanup"
        default: "cleanup"
      script:
        description: "probe script name in scripts/"
        default: "probe_rate_pages"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        if: inputs.mode == 'probe'
        run: |
          python3 scripts/${{ inputs.script }}.py
          cd probe
          git init -q -b probe-results
          git config user.name "ExpatGuideME robot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Probe $(date -u +%F' '%H:%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-results
      - name: Delete the probe-results branch
        if: inputs.mode != 'probe'
        run: git push origin --delete probe-results || true
