# Manual one-off: find which exchange houses publish their rates on public web pages.
name: Probe rate pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/probe_rate_pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe/
          retention-days: 3
