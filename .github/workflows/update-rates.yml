# Builds and publishes expatguideme.com on GitHub Pages.
# - Every push to main: rebuild all 8 languages and publish.
# - Every 2 hours: fetch the latest exchange rates, gold spot price and any
#   provider rates checked in their apps, rebuild, publish, and save the new
#   data files back to the repository (only when something changed).
# - Once a day (04:15 UTC = 07:15 Riyadh) the same run also pings IndexNow.
# Visitors' browsers also fetch the live market rate and gold price when a page
# opens, so the numbers baked into the pages are only the fallback.
# Repository setting needed once: Settings > Pages > Source = "GitHub Actions".
name: Update rates and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */2 * * *"    # rates + gold every 2 hours
    - cron: "15 4 * * *"     # daily run that also pings IndexNow
  workflow_dispatch:
    inputs:
      ping_all:
        description: "Ping IndexNow with every page (use once after moving hosts)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build tools
        run: npm install --no-audit --no-fund
      - name: Fetch latest rates, gold and checked provider rates
        if: github.event_name != 'push'
        run: python3 scripts/update_rates.py
      - name: Build all languages
        run: NODE_PATH=$PWD/node_modules python3 _src/build.py
      - name: Save new data to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "ExpatGuideME robot"
          git config user.email "actions@users.noreply.github.com"
          git add _src/data/rates.json _src/data/provider_rates.json
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Rate update $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '15 4 * * *')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ping IndexNow
        run: |
          sleep 30
          python3 scripts/indexnow.py ${{ inputs.ping_all && '--all' || '' }}
