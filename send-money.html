            ar: "تطبيق من شركة جلوبال للصرافة في عُمان. حوّل إلى حسابات بنكية أو محافظ جوال أو للاستلام النقدي، واطّلع على الأسعار المباشرة قبل التحويل.",
            hi: "ओमान की ग्लोबल मनी एक्सचेंज का ऐप। बैंक खाते, मोबाइल वॉलेट या कैश पिकअप के लिए भेजें, और भेजने से पहले लाइव रेट देखें।",
            ml: "ഒമാനിലെ ഗ്ലോബൽ മണി എക്സ്ചേഞ്ചിന്റെ ആപ്പ്. ബാങ്ക് അക്കൗണ്ടിലേക്കോ മൊബൈൽ വാലറ്റിലേക്കോ പണമായി കൈപ്പറ്റാനോ അയക്കാം; അയക്കുന്നതിന് മുമ്പ് തത്സമയ നിരക്ക് കാണാം.",
            ne: "ओमानको ग्लोबल मनी एक्सचेन्जको एप। बैंक खाता, मोबाइल वालेट वा नगद भुक्तानीका लागि पठाउनुहोस्, र पठाउनुअघि लाइभ दर हेर्नुहोस्।"
          }
        },
        {
          name: "BFC", countries: ["bh"], type: "exchange", delivery: ["bank", "cash"],
          url: "https://www.bfc.com.bh/", affiliate: "",
          why: {
            en: "Bahrain's long-established exchange company, founded in 1917, with 54 branches, online transfers and the BFC Pay app. Announced a Western Union partnership in 2026.",
            ar: "شركة صرافة عريقة في البحرين تأسست عام ١٩١٧، لديها ٥٤ فرعًا وتحويلات إلكترونية وتطبيق «بي إف سي باي»، وأعلنت شراكة مع ويسترن يونيون في ٢٠٢٦.",
            hi: "बहरीन की पुरानी एक्सचेंज कंपनी (1917 से), 54 ब्रांच, ऑनलाइन ट्रांसफ़र और BFC Pay ऐप। 2026 में वेस्टर्न यूनियन के साथ साझेदारी की घोषणा की।",
            ml: "1917-ൽ സ്ഥാപിതമായ ബഹ്‌റൈനിലെ പഴക്കമുള്ള എക്സ്ചേഞ്ച് കമ്പനി; 54 ശാഖകൾ, ഓൺലൈൻ ട്രാൻസ്ഫർ, BFC Pay ആപ്പ്. 2026-ൽ വെസ്റ്റേൺ യൂണിയനുമായി പങ്കാളിത്തം പ്രഖ്യാപിച്ചു.",
            ne: "सन् १९१७ देखि सञ्चालित बहराइनको पुरानो एक्सचेन्ज कम्पनी; ५४ शाखा, अनलाइन ट्रान्सफर र BFC Pay एप। सन् २०२६ मा वेस्टर्न युनियनसँग साझेदारी घोषणा गरेको।"
          }
        }
      ];

      var current = "sa";
      try {
        var saved = localStorage.getItem(PREF_KEY);
        if (saved && COUNTRIES.some(function (c) { return c.code === saved; })) current = saved;
      } catch (e) {}

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      function renderTabs(lang) {
        var wrap = document.getElementById("countryTabs");
        wrap.innerHTML = "";
        COUNTRIES.forEach(function (c) {
          var b = el("button", null, c.flag + " " + (c[lang] || c.en));
          b.type = "button";
          b.setAttribute("aria-pressed", c.code === current ? "true" : "false");
          b.addEventListener("click", function () {
            current = c.code;
            try { localStorage.setItem(PREF_KEY, current); } catch (e) {}
            render(window.ExpatSite.lang());
          });
          wrap.appendChild(b);
        });
      }

      function renderRows(lang) {
        var L = T[lang] || T.en;
        var body = document.getElementById("providerRows");
        body.innerHTML = "";
        PROVIDERS.filter(function (p) { return p.countries.indexOf(current) !== -1; }).forEach(function (p, i) {
          var tr = el("tr", "reveal");
          tr.style.setProperty("--i", i);

          var tdName = el("td");
          tdName.setAttribute("data-label", L.colService);
          tdName.appendChild(el("div", "p-name", p.name));
          tdName.appendChild(el("div", "p-type", L.types[p.type]));
          tr.appendChild(tdName);

          var tdDel = el("td");
          tdDel.setAttribute("data-label", L.colDelivery);
          var chips = el("div", "chips");
          p.delivery.forEach(function (d) { chips.appendChild(el("span", "chip", L.delivery[d])); });
          tdDel.appendChild(chips);
          tr.appendChild(tdDel);

          var tdWhy = el("td", "p-why", p.why[lang] || p.why.en);
          tdWhy.setAttribute("data-label", L.colWhy);
          tr.appendChild(tdWhy);

          var tdAct = el("td", "p-action");
          var isPartner = !!p.affiliate;
          if (isPartner) tdAct.appendChild(el("span", "partner", L.partner));
          var a = el("a", "btn " + (isPartner ? "btn-primary" : "btn-ghost"), L.visit);
          a.href = isPartner ? p.affiliate : p.url;
          a.target = "_blank";
          a.rel = isPartner ? "sponsored noopener" : "noopener";
          a.setAttribute("aria-label", L.visit + ": " + p.name);
          tdAct.appendChild(a);
          tr.appendChild(tdAct);

          body.appendChild(tr);
        });
        window.ExpatSite.tagOutbound(body);
      }

      function render(lang) {
        var L = T[lang] || T.en;
        document.querySelectorAll("[data-t]").forEach(function (n) { n.textContent = L[n.getAttribute("data-t")] || T.en[n.getAttribute("data-t")] || ""; });
        renderTabs(lang);
        renderRows(lang);
      }

      window.ExpatSite.onLang(render);
    })();
  </script>
</body>
</html>
