<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpatGuideME | Simple guides and free tools for expats in the Gulf</title>
  <meta name="description" content="Free tools and simple guides for expats in Saudi Arabia, Kuwait, Qatar, Oman and Bahrain. Exchange rates, money transfer, ID and residency, end-of-service and more. In English, Arabic, Hindi and Malayalam.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Cairo:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #14213d;
      --muted: #5c6b80;
      --brand: #0b6e4f;
      --brand-dark: #08563e;
      --brand-soft: #e6f4ee;
      --bg: #f6f8fb;
      --card: #ffffff;
      --line: #e3e8ef;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    html[lang="ar"] body { font-family: "Cairo", "Inter", Tahoma, sans-serif; line-height: 1.8; }
    html[lang="hi"] body { font-family: "Noto Sans Devanagari", "Inter", sans-serif; line-height: 1.8; }
    html[lang="ml"] body { font-family: "Noto Sans Malayalam", "Inter", sans-serif; line-height: 1.8; }

    .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

    header { background: var(--card); border-bottom: 1px solid var(--line); }
    .nav { display: flex; justify-content: space-between; align-items: center; min-height: 60px; gap: 10px; flex-wrap: wrap; padding: 8px 0; }
    .logo { font-family: "Inter", sans-serif; font-weight: 700; font-size: 1.3rem; color: var(--ink); text-decoration: none; direction: ltr; }
    .logo span { color: var(--brand); }
    .langs { display: flex; gap: 6px; flex-wrap: wrap; }
    .langs button {
      font: inherit; font-size: 0.85rem; font-weight: 600;
      padding: 5px 12px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
    }
    .langs button[lang="ar"] { font-family: "Cairo", sans-serif; }
    .langs button[lang="hi"] { font-family: "Noto Sans Devanagari", sans-serif; }
    .langs button[lang="ml"] { font-family: "Noto Sans Malayalam", sans-serif; }
    .langs button.active { background: var(--brand); color: #fff; border-color: var(--brand); }

    .hero { padding: 40px 0 24px; }
    .hero h1 { font-size: 2rem; line-height: 1.3; margin-bottom: 8px; }
    .hero p { color: var(--muted); font-size: 1.1rem; }

    h2 { font-size: 1.2rem; margin: 18px 0 12px; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .tool {
      display: flex; flex-direction: column; gap: 6px;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 18px; text-decoration: none; color: var(--ink); min-height: 150px;
    }
    a.tool:hover { border-color: var(--brand); box-shadow: 0 4px 16px rgba(11,110,79,0.08); }
    .tool .icon { font-size: 1.6rem; }
    .tool h3 { font-size: 1.05rem; line-height: 1.4; }
    .tool p { color: var(--muted); font-size: 0.92rem; flex: 1; }
    .tag {
      align-self: flex-start; font-size: 0.75rem; font-weight: 600;
      padding: 3px 10px; border-radius: 999px;
    }
    .tag.live { background: var(--brand); color: #fff; }
    .tag.soon { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
    .tool.disabled { opacity: 0.75; }

    .countries { display: flex; flex-wrap: wrap; gap: 10px; }
    .country {
      background: var(--card); border: 1px solid var(--line); border-radius: 999px;
      padding: 8px 16px; font-weight: 600; font-size: 0.95rem;
    }

    .ad-slot {
      min-height: 100px; border: 1px dashed var(--line); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: #a0aec0; font-size: 0.85rem; margin: 28px 0 8px;
    }

    footer { color: var(--muted); font-size: 0.82rem; text-align: center; padding: 26px 0 40px; }

    @media (max-width: 820px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 1.6rem; }
      .tool { min-height: 0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="wrap nav">
      <a class="logo" href="index.html">ExpatGuide<span>ME</span></a>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" lang="en">English</button>
        <button type="button" data-lang="ar" lang="ar">العربية</button>
        <button type="button" data-lang="hi" lang="hi">हिन्दी</button>
        <button type="button" data-lang="ml" lang="ml">മലയാളം</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1 data-t="tagline"></h1>
      <p data-t="intro"></p>
    </section>

    <h2 data-t="toolsHeading"></h2>
    <div class="grid" id="tools"></div>

    <h2 data-t="countriesHeading"></h2>
    <div class="countries" id="countries"></div>

    <div class="ad-slot" data-t="ad"></div>
  </main>

  <footer>
    <div class="wrap">
      <p data-t="disclaimer"></p>
    </div>
  </footer>

  <script>
    (function () {
      "use strict";

      var PREF_KEY = "expatguideme_prefs_v1";

      var T = {
        en: {
          tagline: "Simple guides and free tools for expats in the Gulf",
          intro: "In your own language. Saudi Arabia, Kuwait, Qatar, Oman and Bahrain.",
          toolsHeading: "Tools & guides",
          countriesHeading: "Countries",
          live: "Open",
          soon: "Coming soon",
          ad: "Advertisement",
          disclaimer: "This is an independent website. It is not connected to any government office or bank."
        },
        ar: {
          tagline: "أدلة بسيطة وأدوات مجانية للمقيمين في الخليج",
          intro: "بلغتك. السعودية والكويت وقطر وعُمان والبحرين.",
          toolsHeading: "الأدوات والأدلة",
          countriesHeading: "الدول",
          live: "افتح",
          soon: "قريبًا",
          ad: "مساحة إعلانية",
          disclaimer: "هذا موقع مستقل، ولا علاقة له بأي جهة حكومية أو بنك."
        },
        hi: {
          tagline: "खाड़ी में रहने वाले प्रवासियों के लिए आसान गाइड और मुफ़्त टूल",
          intro: "आपकी अपनी भाषा में। सऊदी अरब, कुवैत, क़तर, ओमान और बहरीन।",
          toolsHeading: "टूल और गाइड",
          countriesHeading: "देश",
          live: "खोलें",
          soon: "जल्द आ रहा है",
          ad: "विज्ञापन",
          disclaimer: "यह एक स्वतंत्र वेबसाइट है। इसका किसी सरकारी विभाग या बैंक से कोई संबंध नहीं है।"
        },
        ml: {
          tagline: "ഗൾഫിലെ പ്രവാസികൾക്ക് ലളിതമായ ഗൈഡുകളും സൗജന്യ ടൂളുകളും",
          intro: "നിങ്ങളുടെ സ്വന്തം ഭാഷയിൽ. സൗദി അറേബ്യ, കുവൈത്ത്, ഖത്തർ, ഒമാൻ, ബഹ്‌റൈൻ.",
          toolsHeading: "ടൂളുകളും ഗൈഡുകളും",
          countriesHeading: "രാജ്യങ്ങൾ",
          live: "തുറക്കുക",
          soon: "ഉടൻ വരുന്നു",
          ad: "പരസ്യം",
          disclaimer: "ഇതൊരു സ്വതന്ത്ര വെബ്സൈറ്റാണ്. ഏതെങ്കിലും സർക്കാർ വകുപ്പുമായോ ബാങ്കുമായോ ഇതിന് ബന്ധമില്ല."
        }
      };

      var TOOLS = [
        {
          icon: "💱", href: "exchange-rate.html",
          en: ["Exchange rate today", "Riyal and dinar to rupee, taka, peso and more."],
          ar: ["سعر الصرف اليوم", "الريال والدينار إلى الروبية والتاكا والبيزو وغيرها."],
          hi: ["आज का एक्सचेंज रेट", "रियाल और दीनार से रुपया, टका, पेसो और अन्य।"],
          ml: ["ഇന്നത്തെ വിനിമയ നിരക്ക്", "റിയാൽ, ദിനാർ എന്നിവ രൂപ, ടാക്ക, പെസോ തുടങ്ങിയവയിലേക്ക്."]
        },
        {
          icon: "💸", href: null,
          en: ["Best way to send money home", "Compare transfer apps and banks."],
          ar: ["أفضل طريقة لتحويل الأموال", "قارن تطبيقات التحويل والبنوك."],
          hi: ["घर पैसे भेजने का सबसे अच्छा तरीका", "ट्रांसफ़र ऐप और बैंकों की तुलना करें।"],
          ml: ["നാട്ടിലേക്ക് പണം അയക്കാൻ മികച്ച വഴി", "ട്രാൻസ്ഫർ ആപ്പുകളും ബാങ്കുകളും താരതമ്യം ചെയ്യുക."]
        },
        {
          icon: "🪪", href: null,
          en: ["ID card & residency guide", "Iqama, Civil ID, QID, Resident Card and CPR: check, renew, fees."],
          ar: ["دليل الإقامة والهوية", "الإقامة والبطاقة المدنية وغيرها: الاستعلام والتجديد والرسوم."],
          hi: ["आईडी कार्ड और रेज़िडेंसी गाइड", "इक़ामा, सिविल आईडी, क्यूआईडी: जाँच, नवीनीकरण और फ़ीस।"],
          ml: ["ഐഡി കാർഡ്, റെസിഡൻസി ഗൈഡ്", "ഇഖാമ, സിവിൽ ഐഡി, ക്യുഐഡി: പരിശോധന, പുതുക്കൽ, ഫീസ്."]
        },
        {
          icon: "🧮", href: null,
          en: ["End-of-service benefit", "Estimate what you should receive."],
          ar: ["مكافأة نهاية الخدمة", "قدّر المبلغ المستحق لك."],
          hi: ["सेवा समाप्ति लाभ", "अनुमान लगाएँ कि आपको कितना मिलना चाहिए।"],
          ml: ["സേവനാന്ത ആനുകൂല്യം", "നിങ്ങൾക്ക് ലഭിക്കേണ്ട തുക കണക്കാക്കുക."]
        },
        {
          icon: "👨‍👩‍👧", href: null,
          en: ["Family monthly cost", "Rent, school, fees and bills in one place."],
          ar: ["تكلفة العائلة الشهرية", "الإيجار والمدارس والرسوم والفواتير في مكان واحد."],
          hi: ["परिवार का मासिक खर्च", "किराया, स्कूल, फ़ीस और बिल एक जगह।"],
          ml: ["കുടുംബത്തിന്റെ മാസച്ചെലവ്", "വാടക, സ്കൂൾ, ഫീസ്, ബില്ലുകൾ ഒരിടത്ത്."]
        },
        {
          icon: "🛂", href: null,
          en: ["Embassy services", "Passport renewal, PCC, OCI and attestation."],
          ar: ["خدمات السفارات", "تجديد الجواز وشهادة حسن السيرة والتصديق."],
          hi: ["दूतावास सेवाएँ", "पासपोर्ट नवीनीकरण, पीसीसी, ओसीआई और सत्यापन।"],
          ml: ["എംബസി സേവനങ്ങൾ", "പാസ്പോർട്ട് പുതുക്കൽ, പിസിസി, ഒസിഐ, അറ്റസ്റ്റേഷൻ."]
        }
      ];

      var COUNTRIES = [
        { flag: "🇸🇦", en: "Saudi Arabia", ar: "السعودية", hi: "सऊदी अरब", ml: "സൗദി അറേബ്യ" },
        { flag: "🇰🇼", en: "Kuwait", ar: "الكويت", hi: "कुवैत", ml: "കുവൈത്ത്" },
        { flag: "🇶🇦", en: "Qatar", ar: "قطر", hi: "क़तर", ml: "ഖത്തർ" },
        { flag: "🇴🇲", en: "Oman", ar: "عُمان", hi: "ओमान", ml: "ഒമാൻ" },
        { flag: "🇧🇭", en: "Bahrain", ar: "البحرين", hi: "बहरीन", ml: "ബഹ്‌റൈൻ" }
      ];

      var lang = "en";

      function readPrefs() {
        try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (e) { return {}; }
      }
      function savePrefs(update) {
        try {
          var p = readPrefs();
          for (var k in update) p[k] = update[k];
          localStorage.setItem(PREF_KEY, JSON.stringify(p));
        } catch (e) {}
      }

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      function render() {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

        document.querySelectorAll("[data-t]").forEach(function (n) {
          n.textContent = T[lang][n.getAttribute("data-t")] || "";
        });
        document.querySelectorAll(".langs button").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-lang") === lang);
        });

        var grid = document.getElementById("tools");
        grid.innerHTML = "";
        TOOLS.forEach(function (t) {
          var card = el(t.href ? "a" : "div", "tool" + (t.href ? "" : " disabled"));
          if (t.href) card.href = t.href;
          card.appendChild(el("div", "icon", t.icon));
          card.appendChild(el("h3", null, t[lang][0]));
          card.appendChild(el("p", null, t[lang][1]));
          card.appendChild(el("span", "tag " + (t.href ? "live" : "soon"), t.href ? T[lang].live : T[lang].soon));
          grid.appendChild(card);
        });

        var cl = document.getElementById("countries");
        cl.innerHTML = "";
        COUNTRIES.forEach(function (c) {
          cl.appendChild(el("span", "country", c.flag + " " + c[lang]));
        });
      }

      document.querySelectorAll(".langs button").forEach(function (b) {
        b.addEventListener("click", function () {
          lang = b.getAttribute("data-lang");
          savePrefs({ lang: lang });
          render();
        });
      });

      var p = readPrefs();
      if (T[p.lang]) lang = p.lang;
      render();
    })();
  </script>
</body>
</html>
